plugins {
    id 'com.android.application'
}

if (providers.gradleProperty('helengineBuildRoot').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('helengineBuildRoot').get()))
}

android {
    namespace 'com.helengine.android'
    compileSdk 35
    ndkVersion '27.0.12077973'

    buildFeatures {
        shaders true
    }

    defaultConfig {
        applicationId 'com.helengine.android.scaffold'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
            if (providers.gradleProperty('helengineNativeBuildRoot').isPresent()) {
                buildStagingDirectory file(providers.gradleProperty('helengineNativeBuildRoot').get())
            }
        }
    }
}
